<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#111">TBU Envelope Proof — 2048-tile co-sim</text>
  <text x="450" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#555">Unconstrained vs controlled fabric power</text>

  <!-- plot frame -->
  <rect x="80" y="80" width="740" height="360" fill="#fafafa" stroke="#ccc"/>

  <!-- grid -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="80" y1="170" x2="820" y2="170"/>
    <line x1="80" y1="260" x2="820" y2="260"/>
    <line x1="80" y1="350" x2="820" y2="350"/>
    <line x1="265" y1="80" x2="265" y2="440"/>
    <line x1="450" y1="80" x2="450" y2="440"/>
    <line x1="635" y1="80" x2="635" y2="440"/>
  </g>

  <!-- 4 W envelope (y: 0W at 440, 9W at 80 → 4W at 440-160=280) -->
  <line x1="80" y1="280" x2="820" y2="280" stroke="#2c3e50" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- 2.8 W design -->
  <line x1="80" y1="328" x2="820" y2="328" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- unconstrained: 0.56→8.4 W over load 0.2→3.0  (x: 80→820, y inverse) -->
  <polyline fill="none" stroke="#c0392b" stroke-width="3"
    points="80,418 140,395 200,372 260,349 320,326 360,300 400,274 440,248 480,222 520,196 560,170 600,144 640,118 680,100 720,92 760,88 800,86 820,84"/>

  <!-- controlled: stays low, peak ~0.92 W near mid -->
  <polyline fill="none" stroke="#1a7f4b" stroke-width="3"
    points="80,435 140,432 200,428 260,424 320,418 360,412 400,400 440,388 460,404 500,430 540,438 580,439 640,440 720,440 820,440"/>

  <!-- axes labels -->
  <text x="450" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#333">Load factor (× intensity-cap demand)</text>
  <text x="28" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#333" transform="rotate(-90 28 260)">Fabric power (W)</text>

  <text x="70" y="444" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#555">0</text>
  <text x="70" y="284" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#555">4</text>
  <text x="70" y="88" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#555">9</text>
  <text x="80" y="458" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">0.2</text>
  <text x="450" y="458" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">1.6</text>
  <text x="820" y="458" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">3.0</text>

  <!-- legend -->
  <rect x="560" y="95" width="240" height="78" fill="#fff" stroke="#ddd" rx="6"/>
  <line x1="575" y1="115" x2="610" y2="115" stroke="#c0392b" stroke-width="3"/>
  <text x="620" y="119" font-family="system-ui,sans-serif" font-size="12" fill="#333">Unconstrained</text>
  <line x1="575" y1="138" x2="610" y2="138" stroke="#1a7f4b" stroke-width="3"/>
  <text x="620" y="142" font-family="system-ui,sans-serif" font-size="12" fill="#333">Controlled (TBU)</text>
  <line x1="575" y1="160" x2="610" y2="160" stroke="#2c3e50" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="620" y="164" font-family="system-ui,sans-serif" font-size="12" fill="#333">4 W envelope</text>

  <text x="450" y="508" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#222">Peak unconstrained 8.40 W → controlled 0.92 W · Envelope 4.0 W respected</text>
</svg>
